apiVersion: 1

providers:
  - name: 'default'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards

dashboards:
  - title: 'Edu-Flow API Overview'
    description: 'Main dashboard for Edu-Flow API monitoring'
    tags: ['api', 'eduflow']
    orgId: 1
    folder: Main
    version: 1
    panels:
      - title: 'API Requests'
        type: graph
        dataSource: Prometheus
        targets:
          - target: 'rate(api_requests_total[5m])'
        timeFrom: 10m
        timeShift: 0s
        legend: '{{method}}'
        seriesOverrides:
          - alias: 'GET'
            color: '#268bd2'
          - alias: 'POST'
            color: '#2aa198'
          - alias: 'PUT'
            color: '#d33682'
          - alias: 'DELETE'
            color: '#dc322f'
        alert:
          name: 'High API Request Rate'
          message: 'API request rate is high: {{ $value }} requests/second'
          expr: 'rate(api_requests_total[5m]) > 100'
          duration: 5m
          labels:
            severity: warning
          annotations:
            summary: 'High API request rate'
            description: 'API request rate is {{ $value }} requests/second'

      - title: 'API Response Time'
        type: graph
        dataSource: Prometheus
        targets:
          - target: 'histogram_quantile(0.95, rate(api_response_time_seconds_bucket[5m]))'
        timeFrom: 10m
        timeShift: 0s
        legend: '95th Percentile'
        alert:
          name: 'Slow API Response'
          message: 'API response time is high: {{ $value }} seconds'
          expr: 'histogram_quantile(0.95, rate(api_response_time_seconds_bucket[5m])) > 2'
          duration: 5m
          labels:
            severity: warning
          annotations:
            summary: 'Slow API response time'
            description: 'API response time is {{ $value }} seconds'

      - title: 'Error Rate'
        type: graph
        dataSource: Prometheus
        targets:
          - target: 'rate(api_errors_total[5m])'
        timeFrom: 10m
        timeShift: 0s
        legend: '{{error_type}}'
        alert:
          name: 'High Error Rate'
          message: 'API error rate is high: {{ $value }} errors/second'
          expr: 'rate(api_errors_total[5m]) > 5'
          duration: 5m
          labels:
            severity: error
          annotations:
            summary: 'High API error rate'
            description: 'API error rate is {{ $value }} errors/second'

      - title: 'Database Queries'
        type: graph
        dataSource: Prometheus
        targets:
          - target: 'rate(db_queries_total[5m])'
        timeFrom: 10m
        timeShift: 0s
        legend: '{{query_type}}'

      - title: 'Slow Database Queries'
        type: graph
        dataSource: Prometheus
        targets:
          - target: 'rate(db_slow_queries_total[5m])'
        timeFrom: 10m
        timeShift: 0s
        legend: '{{query_type}}'
        alert:
          name: 'Slow Database Query'
          message: 'Database query is slow: {{ $value }} queries/second'
          expr: 'rate(db_slow_queries_total[5m]) > 1'
          duration: 5m
          labels:
            severity: warning
          annotations:
            summary: 'Slow database query'
            description: 'Database query rate is {{ $value }} queries/second'

      - title: 'System CPU Usage'
        type: graph
        dataSource: Prometheus
        targets:
          - target: '100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)'
        timeFrom: 10m
        timeShift: 0s
        legend: 'CPU Usage %'
        alert:
          name: 'High CPU Usage'
          message: 'CPU usage is high: {{ $value }}%'
          expr: '100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80'
          duration: 5m
          labels:
            severity: warning
          annotations:
            summary: 'High CPU usage'
            description: 'CPU usage is {{ $value }}%'

      - title: 'System Memory Usage'
        type: graph
        dataSource: Prometheus
        targets:
          - target: '100 - ((node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100)'
        timeFrom: 10m
        timeShift: 0s
        legend: 'Memory Usage %'
        alert:
          name: 'High Memory Usage'
          message: 'Memory usage is high: {{ $value }}%'
          expr: '100 - ((node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100) > 90'
          duration: 5m
          labels:
            severity: critical
          annotations:
            summary: 'High memory usage'
            description: 'Memory usage is {{ $value }}%'

      - title: 'Disk Usage'
        type: graph
        dataSource: Prometheus
        targets:
          - target: '(1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100'
        timeFrom: 10m
        timeShift: 0s
        legend: 'Disk Usage %'
        alert:
          name: 'High Disk Usage'
          message: 'Disk usage is high: {{ $value }}%'
          expr: '(1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 95'
          duration: 5m
          labels:
            severity: critical
          annotations:
            summary: 'High disk usage'
            description: 'Disk usage is {{ $value }}%'

  - title: 'Edu-Flow API Health'
    description: 'Dashboard for API health monitoring'
    tags: ['api', 'health', 'eduflow']
    orgId: 1
    folder: Health
    version: 1
    panels:
      - title: 'API Health Status'
        type: singlestat
        dataSource: Prometheus
        targets:
          - target: 'up{job="eduflow-health"}'
        valueMaps:
          - 0: 'DOWN'
          - 1: 'UP'
        thresholds:
          - type: number
            value: 0
            color: red
          - type: number
            value: 1
            color: green
        alert:
          name: 'API Health Check Failure'
          message: 'API health check is down'
          expr: 'up{job="eduflow-health"} == 0'
          duration: 1m
          labels:
            severity: critical
          annotations:
            summary: 'API health check failed'
            description: 'API health check is down'

      - title: 'Response Time Distribution'
        type: graph
        dataSource: Prometheus
        targets:
          - target: 'api_response_time_seconds_histogram_bucket{le="0.1"}'
          - target: 'api_response_time_seconds_histogram_bucket{le="0.5"}'
          - target: 'api_response_time_seconds_histogram_bucket{le="1.0"}'
          - target: 'api_response_time_seconds_histogram_bucket{le="2.0"}'
          - target: 'api_response_time_seconds_histogram_bucket{le="5.0"}'
        timeFrom: 10m
        timeShift: 0s

  - title: 'Edu-Flow User Analytics'
    description: 'User activity and analytics dashboard'
    tags: ['users', 'analytics', 'eduflow']
    orgId: 1
    folder: Analytics
    version: 1
    panels:
      - title: 'Active Users'
        type: graph
        dataSource: Prometheus
        targets:
          - target: 'rate(api_requests_total[5m])'
        timeFrom: 30m
        timeShift: 0s
        legend: 'User Requests'

      - title: 'User Registration Rate'
        type: graph
        dataSource: Prometheus
        targets:
          - target: 'rate(api_requests_total{endpoint="/users/register"}[5m])'
        timeFrom: 30m
        timeShift: 0s
        legend: 'Registration Rate'

      - title: 'User Login Rate'
        type: graph
        dataSource: Prometheus
        targets:
          - target: 'rate(api_requests_total{endpoint="/users/token"}[5m])'
        timeFrom: 30m
        timeShift: 0s
        legend: 'Login Rate'

  - title: 'Database Performance'
    description: 'Database performance monitoring'
    tags: ['database', 'performance', 'eduflow']
    orgId: 1
    folder: Database
    version: 1
    panels:
      - title: 'Query Response Time'
        type: graph
        dataSource: Prometheus
        targets:
          - target: 'histogram_quantile(0.95, rate(db_query_duration_seconds_bucket[5m]))'
        timeFrom: 30m
        timeShift: 0s
        legend: '95th Percentile'

      - title: 'Connection Pool Usage'
        type: graph
        dataSource: Prometheus
        targets:
          - target: 'rate(db_connections_active[5m])'
          - target: 'rate(db_connections_pool_size[5m])'
        timeFrom: 30m
        timeShift: 0s
        legend: ['Active Connections', 'Pool Size']

      - title: 'Query Types'
        type: graph
        dataSource: Prometheus
        targets:
          - target: 'rate(db_queries_total[5m])'
        timeFrom: 30m
        timeShift: 0s
        legend: '{{query_type}}'