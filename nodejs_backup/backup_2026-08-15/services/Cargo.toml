[package]
name = "edu-flow-services"
version = "0.1.0"
edition = "2021"
authors = ["Edu-Flow Team"]
description = "AI and microservices for Edu-Flow backend using Rust and Candle"

[lib]
name = "edu_flow_services"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core dependencies
tokio = { version = "1.0", features = ["full"] }
tokio-serde = { version = "0.8", features = ["json"] }
tokio-stream = { version = "0.1" }
futures = "0.3"

# Web and API
warp = "0.3"
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# AI/ML with Candle
candle-core = "0.3"
candle-nn = "0.3"
candle-transformers = "0.3"
candle-kernels = "0.3"
ndarray = "0.15"

# Data processing
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Configuration
config = "0.13"
dotenv = "0.15"

# Logging and monitoring
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
prometheus = "0.13"

# Database and cache
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "sqlite", "chrono", "uuid"] }
redis = { version = "0.23", features = ["tokio-comp", "json"] }

# Authentication and security
jsonwebtoken = "8.0"
bcrypt = "0.15"
sha2 = "0.10"

# File handling
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.0"

# Testing
[dev-dependencies]
tokio-test = "0.4"
mockall = "0.11"

[features]
default = ["postgres"]
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true