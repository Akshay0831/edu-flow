version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: edu-flow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Redis command line interface for debugging
  redis-cli:
    image: redis:7-alpine
    depends_on:
      - redis
    command: redis-cli -h redis ping
    profiles:
      - debug

volumes:
  redis_data:
    driver: local