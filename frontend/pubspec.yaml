name: edu_flow
description: Education Management System - Modern Flutter Frontend
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.9
  intl: ^0.20.2
  http: ^1.1.0
  provider: ^6.0.5
  flutter_riverpod: ^2.4.9
  go_router: ^12.1.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^8.0.0
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  dartz: ^0.10.1
  flutter_bloc: ^8.1.3
  flutter_dotenv: ^5.1.0
  cached_network_image: ^3.2.3
  fluttertoast: ^8.2.4
  shimmer: ^3.0.0
  table_calendar: ^3.0.8
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  mockito: ^5.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - .env

