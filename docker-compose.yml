services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: eduflow
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eduflow-network

  # MongoDB
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - eduflow-network

  # Redis for caching
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - eduflow-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:password123@postgres:5432/eduflow
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/eduflow?authSource=admin
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=your-secret-key-change-in-production
    depends_on:
      - postgres
      - mongodb
      - redis
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - eduflow-network

  # Rust AI Services
  ai-services:
    build:
      context: ./services
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - RUST_LOG=info
    depends_on:
      - postgres
      - mongodb
      - redis
    volumes:
      - ./services/logs:/app/logs
    networks:
      - eduflow-network

  # Flutter Frontend (Web)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
      - ai-services
    networks:
      - eduflow-network

volumes:
  postgres_data:
  mongodb_data:

networks:
  eduflow-network:
    driver: bridge