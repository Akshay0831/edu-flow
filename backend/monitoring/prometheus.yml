# Prometheus configuration for Edu-Flow API

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Rule files
rule_files:
  - "alert_rules.yml"

# Scrape configuration
scrape_configs:
  # Edu-Flow API Service
  - job_name: 'eduflow-api'
    static_configs:
      - targets: ['backend-api:8000']
    scrape_interval: 15s
    metrics_path: '/metrics'
    scheme: 'http'
    
    # Labels for service discovery
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter (for system metrics if needed)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

  # Redis Exporter (for Redis metrics)
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  # PostgreSQL Exporter (for PostgreSQL metrics)
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # MongoDB Exporter (for MongoDB metrics)
  - job_name: 'mongodb-exporter'
    static_configs:
      - targets: ['mongodb-exporter:9216']
    scrape_interval: 30s

  # Edu-Flow API Health Check
  - job_name: 'eduflow-health'
    static_configs:
      - targets: ['backend-api:8000']
    metrics_path: '/health'
    scrape_interval: 30s
    scrape_timeout: 10s